###################################################################
#                                                                 #
#  This docker-compose.yaml file comprehends 5 profiles           #
#                                                                 #
#  - local:     development environment                           #
#  - catalog:   development of the frontend using the new backend #
#  - if:        staging environment                               #
#  - stifront:  frontend production environment                   #
#  - stiback:   backend production environment                    #
#                                                                 #
#  To setup a specific profile, run:                              #
#  docker-compose --profile <profile> up -d                       #
#                                                                 #
#  More information at https://docs.docker.com/compose/profiles/  #
#                                                                 #
###################################################################

volumes:
  nuxtdevdeps:
  data:

services:
  frontend:
    build:
      context: ./frontend
      target: production
    env_file:
      - ./frontend/.env
    ports:
      - 3000:3000
    profiles:
      - if
      - stifront

  frontdev:
    build:
      context: ./frontend
      target: development
    ports:
      - 3000:3000
    volumes:
      - nuxtdevdeps:/usr/src/app/node_modules
      - ./frontend:/usr/src/app
    env_file:
      - ./frontend/.env
    profiles:
      - local
      - catalog

  mongo:
    image: mongo:4.4.1-bionic
    ports:
      - 27017:27017
    env_file:
      - ./server/.env
    volumes:
      - data:/data/db
    profiles:
      - local
      - catalog
      - if
      - stiback
      - cli

  catalogapp:
    build:
      context: ./server
      target: app
    ports:
      - 8080:8080
    depends_on:
      - mongo
    env_file:
      - ./server/.env
    volumes:
      - ./frontend/credentials.json:/credentials.json:ro
    profiles:
      - if
      - stiback
      - catalog

  catalogcli:
    build:
      context: ./server
      target: cli
    depends_on:
      - mongo
    env_file:
      - ./server/.env
    volumes:
      - ./frontend/credentials.json:/credentials.json:ro
    profiles:
      - cli

  caddydev:
    build:
      context: ./caddy
      target: dev
    ports:
      - 5000:5000
    profiles:
      - local
      - catalog

  caddysti:
    build:
      context: ./caddy
      target: sti
    ports:
      - 5000:5000
    profiles:
      - stiback

  caddy:
    build:
      context: ./caddy
      target: prod
    ports:
      - 80:80
      - 443:443
    profiles:
      - if
